[project]
name = "allergen-ml-training"
version = "0.2.0"
description = "Pipeline training deteksi alergen: Word2Vec + BiLSTM dan IndoBERT"
requires-python = ">=3.10,<3.13"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
  ".git",
  ".venv",
  "artifacts",
  "notebooks/.ipynb_checkpoints",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
